# Configuration for Home Credit Default Risk Model Training Pipeline

training:
  val_size: 0.2
  random_state: 42
  stratify: true
  metric: "roc_auc"
  models_dir: "models"
  scale_features: true
  auto_scale_pos_weight: true

xgboost:
  n_estimators: 50
  learning_rate: 0.05
  max_depth: 6
  subsample: 0.8
  colsample_bytree: 0.8
  scale_pos_weight: "auto"
  eval_metric: "auc"
  random_state: 42
  n_jobs: -1
  tree_method: "hist"
  enable_categorical: true

lightgbm:
  n_estimators: 50
  learning_rate: 0.05
  num_leaves: 31
  max_depth: -1
  subsample: 0.8
  colsample_bytree: 0.8
  scale_pos_weight: "auto"
  random_state: 42
  n_jobs: -1
  objective: "binary"
  metric: "auc"
  verbose: -1
