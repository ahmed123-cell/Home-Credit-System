[project]
name = "home-credit-system"
version = "0.1.0"
description = "End-to-end Home Credit default risk pipeline: ingestion, dbt, ML, API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dbt-postgres>=1.11.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "httpx2>=2.13.1",
    "lightgbm>=4.7.0",
    "mlflow>=3.17.0",
    "numpy>=2.5.3",
    "onnx>=1.23.2",
    "onnxmltools>=1.16.0",
    "onnxruntime>=1.31.0",
    "pandas>=3.0.6",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "skl2onnx>=1.20.0",
    "sqlalchemy>=2.1.4",
    "uvicorn>=0.32.0",
    "xgboost>=3.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestion", "src/training"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]

[tool.ruff]
src = [".", "src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]
