home_credit:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DBT_HOST', 'localhost') }}"
      port: "{{ env_var('DBT_PORT', '5432') | as_number }}"
      user: "{{ env_var('DBT_USER', 'home_credit') }}"
      password: "{{ env_var('DBT_PASSWORD', 'home_credit_password') }}"
      dbname: "{{ env_var('DBT_DBNAME', 'home_credit') }}"
      schema: analytics
      threads: 4