# ==============================================================================
# CI/CD Pipeline: Lint, Test & Build
# ==============================================================================
# Triggers on every push and pull request to main.
# Three jobs run in parallel:
#   1. lint     - Ruff code quality checks
#   2. test     - Pytest unit & integration tests
#   3. build    - Docker image build validation (app + airflow)

name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ============================================================================
  # Job 1: Ruff Linting & Formatting Check
  # ============================================================================
  lint:
    name: "Lint (Ruff)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dev dependencies
        run: uv sync --frozen --group dev

      - name: Ruff check (linting)
        run: uv run ruff check . --output-format=github

      - name: Ruff format check
        run: uv run ruff format --check .

  # ============================================================================
  # Job 2: Pytest Unit & Integration Tests
  # ============================================================================
  test:
    name: "Test (Pytest)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgomp1

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install all dependencies (main + dev)
        run: uv sync --frozen --group dev

      - name: Run tests with coverage
        run: |
          uv run pytest tests/ \
            -v \
            --tb=short \
            --cov=src \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  # ============================================================================
  # Job 3: Docker Image Build Validation
  # ============================================================================
  build:
    name: "Build Docker Images"
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build App image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: home-credit-system-app:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Airflow image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.airflow
          push: false
          tags: home-credit-airflow:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
